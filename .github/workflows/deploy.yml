name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # یا شاخه اصلی مخزن شما
  workflow_dispatch: # اجازه اجرای دستی

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- مرحله Build پروژه (مثال برای Node.js) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # ---------------------------------------------

      - name: Deploy to Public Repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: ehsan00taheri/FI-Acc # نام کاربری و مخزن عمومی خود را وارد کنید
          publish_branch: gh-pages
          publish_dir: ./dist # مسیر پوشه خروجی Build خود را وارد کنید (مثلاً build, public)
